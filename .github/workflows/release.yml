name: Release

# Manual or tag-triggered. This workflow VALIDATES and ATTACHES artifacts to a DRAFT release.
# It never publishes to the VS Code Marketplace. npm publishing is opt-in and credential-gated.
on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Also publish the CLI to npm (requires the NPM_TOKEN secret and a free package name)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codemeet
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codemeet" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CODEMEET_TEST_DATABASE_URL: postgresql://codemeet:ci-only-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/package-all.mjs
      - run: pnpm test:db
      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: codemeet-release
          path: |
            release/*.tgz
            release/*.vsix
            release/SHA256SUMS
      - name: Attach to a DRAFT GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.tgz release/*.vsix release/SHA256SUMS \
            --draft --title "CodeMeet ${GITHUB_REF_NAME}" \
            --notes "Draft created by CI. Review SHA256SUMS before publishing. The VSIX is not on the Marketplace."

  publish-npm:
    needs: validate-and-package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
    runs-on: ubuntu-latest
    environment: npm   # configure required reviewers on this environment for a manual approval gate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codemeet-release
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish (only if NPM_TOKEN is set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not configured; refusing to publish."; exit 1; fi
          npm publish release/codemeet-*.tgz --access public
