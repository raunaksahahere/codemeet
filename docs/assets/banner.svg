<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="title desc">
  <title id="title">CodeMeet</title>
  <desc id="desc">Pair-program with your team and your AI agents in VS Code or the terminal. Sam and Sam's Claude, Ava and Ava's Codex collaborate through your CodeMeet server and PostgreSQL. AI proposals are reviewed before approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#1d1146"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="130" font-size="96" font-weight="800" letter-spacing="-4" fill="url(#word)">codemeet</text>
    <text x="76" y="190" font-size="25" fill="#cbd5e1">Your team. Your agents. One shared project.</text>
    <text x="76" y="224" font-size="19" fill="#94a3b8">VS Code + terminal · your server + PostgreSQL</text>
    <g font-size="13" font-weight="700" letter-spacing="0.8">
      <rect x="76" y="254" width="120" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="136" y="276" text-anchor="middle" fill="#67e8f9">LIVE EDITS</text>
      <rect x="208" y="254" width="156" height="34" rx="17" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.8"/>
      <text x="286" y="276" text-anchor="middle" fill="#c7d2fe">REVIEW AI DIFFS</text>
      <rect x="376" y="254" width="140" height="34" rx="17" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.8"/>
      <text x="446" y="276" text-anchor="middle" fill="#ddd6fe">SELF-HOSTED</text>
    </g>

    <rect x="744" y="52" width="218" height="139" rx="12" fill="#0b1222" fill-opacity="0.8" stroke="#22d3ee" stroke-opacity="0.45"/>
    <rect x="990" y="52" width="218" height="139" rx="12" fill="#0b1222" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.55"/>
    <circle cx="770" cy="79" r="5" fill="#22d3ee"/>
    <text x="784" y="85" font-size="19" font-weight="700" fill="#e2e8f0">Sam</text>
    <text x="940" y="83" font-size="11" text-anchor="end" fill="#64748b">VS CODE</text>
    <circle cx="1016" cy="79" r="5" fill="#a78bfa"/>
    <text x="1030" y="85" font-size="19" font-weight="700" fill="#e2e8f0">Ava</text>
    <text x="1186" y="83" font-size="11" text-anchor="end" fill="#64748b">TERMINAL</text>
    <path d="M766 107H940M1012 107H1186" stroke="#334155"/>
    <rect x="766" y="122" width="174" height="30" rx="6" fill="#818cf8" fill-opacity="0.12"/>
    <rect x="1012" y="122" width="174" height="30" rx="6" fill="#a78bfa" fill-opacity="0.12"/>
    <text x="778" y="142" font-size="15" fill="#c7d2fe">Sam's Claude</text>
    <text x="1024" y="142" font-size="15" fill="#ddd6fe">Ava's Codex</text>
    <text x="766" y="173" font-size="12" fill="#94a3b8">isolated AI snapshot</text>
    <text x="1012" y="173" font-size="12" fill="#94a3b8">isolated AI snapshot</text>

    <path d="M853 191V213H1099V191M976 213V241" fill="none" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="976" cy="213" r="4" fill="#c7d2fe"/>
    <rect x="797" y="241" width="358" height="61" rx="10" fill="#0b1222" fill-opacity="0.9" stroke="#475569" stroke-opacity="0.7"/>
    <ellipse cx="822" cy="264" rx="8" ry="3" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
    <path d="M814 264V276C814 280 830 280 830 276V264M814 270C814 274 830 274 830 270" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="843" y="267" font-size="15" font-weight="600" fill="#e2e8f0">Your server + PostgreSQL</text>
    <text x="843" y="287" font-size="12" fill="#94a3b8">Live edits · reviewed and approved AI proposals</text>
  </g>
</svg>
